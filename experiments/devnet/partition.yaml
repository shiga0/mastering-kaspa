services:
  relay:
    image: nginx@sha256:b2e814d28359e77bd0aa5fed1939620075e4ffa0eb20423cc557b375bd5c14ad
    entrypoint: [nginx, -g, "daemon off;"]
    volumes: ["./relay.conf:/etc/nginx/nginx.conf:ro"]
    networks: [lab]
    depends_on: [node-a]
  node-b:
    command: [--devnet, --yes, --nologfiles, --disable-upnp, --nodnsseed, --outpeers=0, --maxinpeers=2, "--connect=${KASPA_LAB_RELAY_IP:-127.0.0.1}:16311", --listen=0.0.0.0:16311, --rpclisten=0.0.0.0:16310, --enable-unsynced-mining, --utxoindex, --appdir=/data, --rpclisten-json=0.0.0.0:18310]
  miner-b:
    image: kaspanet/cpuminer@sha256:60f78ab2828ab24b249c99210eee5a2825303a5226154260dd021ff26d46748b
    platform: linux/arm64
    profiles: [mining]
    command: ["--kaspad-address=127.0.0.1", "--port=16310", "--threads=1", "--mine-when-not-synced", "--mining-address=kaspadev:qpumuen7l8wthtz45p3ftn58pvrs9xlumvkuu2xet8egzkcklqtese6y7tc99"]
    network_mode: service:node-b
    depends_on: [node-b]
    cpus: 1.0
